{% extends "base.html" %}

{% block title %}Вход | ЭкоПиксель{% endblock %}

{% block content %}
<section class="card" style="max-width:560px;margin:24px auto;padding:28px;">
    <h1 class="section-title" style="margin-top:0;">Вход</h1>
    {% if error %}
        <p class="form-errors">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <input type="email" name="email" required placeholder=" ">
            <label>Email</label>
        </div>
        <div class="field">
            <input type="password" name="password" required placeholder=" ">
            <label>Пароль</label>
        </div>
        <button type="submit" class="btn">Войти</button>
    </form>
    <p style="margin-top:16px;">Нет аккаунта? <a href="{% url 'register' %}">Регистрация</a></p>
</section>
{% endblock %}
