{% extends "base.html" %}
{% load ui_i18n %}

{% block title %}{% t "Вход" %} | ЭкоПиксель{% endblock %}

{% block content %}
<section class="card" style="max-width:560px;margin:24px auto;padding:28px;">
    <h1 class="section-title" style="margin-top:0;">{% t "Вход" %}</h1>
    {% if error %}
        <p class="form-errors">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <input type="email" name="email" required placeholder=" ">
            <label>Email</label>
        </div>
        <div class="field">
            <input type="password" name="password" required placeholder=" ">
            <label>{% t "Пароль" %}</label>
        </div>
        <button type="submit" class="btn">{% t "Войти" %}</button>
    </form>
    <p style="margin-top:16px;">{% t "Нет аккаунта?" %} <a href="{% url 'register' %}">{% t "Регистрация" %}</a></p>
</section>
{% endblock %}
